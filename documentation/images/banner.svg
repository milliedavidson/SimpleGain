<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- The plugin's own look: flat Base, the brand's two fonts, and the knob as the plugin draws it at 0 dB.
       Colours are the tokens in Source/PluginEditor.cpp; see documentation/editor-gui.md section 13. -->
  <rect width="1200" height="300" fill="#121417"/>

  <!-- wordmark and lines, in Inter and JetBrains Mono -->
  <text x="70" y="122" font-size="60" fill="#e8eaed" letter-spacing="-1">Simply Gain</text>
  <text x="72" y="162" font-size="20" fill="#8a9099">A gain plugin, built from scratch while learning C++</text>
  <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8a9099">
    <text x="72" y="204">JUCE 8 &#183; CMake &#183; C++17 &#183; Standalone / AU / VST3</text>
    <text x="72" y="230" fill-opacity="0.7">// heavily commented: this whole repo doubles as a C++ tutorial</text>
    <!-- the lockup, as in the bottom-left of the plugin window -->
    <text x="72" y="272" font-size="11">SIMPLY GAIN // maxximum displacement</text>
  </g>

  <!-- the knob: a track with a gap at the bottom, and the apricot arc from the minimum to 0 dB -->
  <g fill="none" stroke-width="5.00" stroke-linecap="round">
    <path d="M 951.22,230.90 A 100 100 0 1 1 1068.78,230.90" stroke="#2a2e34"/>
    <path d="M 951.22,230.90 A 100 100 0 1 1 1084.31,83.09" stroke="#f2a766"/>
  </g>
  <text x="1010" y="146.0" text-anchor="middle" dominant-baseline="central" font-size="29.9" fill="#e8eaed">0.0 dB</text>
  <text x="1010" y="182.0" text-anchor="middle" dominant-baseline="central" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.0" letter-spacing="2.5" fill="#8a9099">GAIN</text>
</svg>
