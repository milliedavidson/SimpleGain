<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#1a1530"/>
      <stop offset="55%" stop-color="#241b3f"/>
      <stop offset="100%" stop-color="#341f4d"/>
    </linearGradient>
    <linearGradient id="knobFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#3a2d5c"/>
      <stop offset="100%" stop-color="#241a3d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- faint waveform texture, left field -->
  <g opacity="0.16" stroke="#c4b5fd" stroke-width="2" fill="none">
    <path d="M0,150 C20,120 40,180 60,150 C80,120 100,190 120,150 C140,110 160,200 180,150 C200,130 220,170 240,150"/>
    <path d="M0,190 C20,175 40,205 60,190 C80,175 100,210 120,190 C140,170 160,215 180,190 C200,180 220,200 240,190" opacity="0.6"/>
  </g>

  <!-- glow behind the knob -->
  <circle cx="1010" cy="150" r="150" fill="url(#glow)"/>

  <!-- wordmark -->
  <text x="70" y="140" font-size="66" font-weight="800" fill="#f5f3ff" letter-spacing="-1">Simple<tspan fill="url(#accent)">Gain</tspan></text>
  <text x="72" y="178" font-size="20" fill="#c4b5fd" font-weight="500">A gain plugin, built from scratch while learning C++</text>

  <text x="72" y="222" font-size="14" fill="#9c8fc4">JUCE 8 &#183; CMake &#183; C++17 &#183; Standalone / AU / VST3</text>

  <!-- little "littered with comments" wink -->
  <text x="72" y="255" font-size="13" fill="#7c6ea8" font-style="italic">// heavily commented — this whole repo doubles as a C++ tutorial</text>

  <!-- the knob -->
  <g transform="translate(1010,150)">
    <circle r="86" fill="none" stroke="#4c3d70" stroke-width="10"/>
    <path d="M -60.8,60.8 A 86,86 0 1 1 60.8,60.8" fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
    <circle r="60" fill="url(#knobFace)" stroke="#4c3d70" stroke-width="2"/>
    <!-- indicator pointing to a healthy +3dB-ish position -->
    <g transform="rotate(35)">
      <rect x="-4" y="-58" width="8" height="26" rx="4" fill="url(#accent)"/>
    </g>
    <circle r="5" fill="#f5f3ff"/>
    <!-- tick marks -->
    <g stroke="#6b5b92" stroke-width="3">
      <line x1="0" y1="-78" x2="0" y2="-70" transform="rotate(-135)"/>
      <line x1="0" y1="-78" x2="0" y2="-70" transform="rotate(-90)"/>
      <line x1="0" y1="-78" x2="0" y2="-70" transform="rotate(-45)"/>
      <line x1="0" y1="-78" x2="0" y2="-70" transform="rotate(0)"/>
      <line x1="0" y1="-78" x2="0" y2="-70" transform="rotate(45)"/>
      <line x1="0" y1="-78" x2="0" y2="-70" transform="rotate(90)"/>
      <line x1="0" y1="-78" x2="0" y2="-70" transform="rotate(135)"/>
    </g>
  </g>
  <text x="1010" y="266" text-anchor="middle" font-size="13" fill="#9c8fc4" letter-spacing="2">GAIN</text>
</svg>
