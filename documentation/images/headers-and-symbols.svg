<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 690" width="940" height="690" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="940" height="690" fill="#ffffff"/>
  <text x="470" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2328">How one .cpp calls code in another .cpp it has never seen</text>
  <text x="470" y="52" text-anchor="middle" font-size="12" fill="#57606a">The header is a <tspan font-style="italic">promise</tspan>. The compiler trusts it. The linker checks it was kept.</text>

  <!-- LEFT: the calling file -->
  <rect x="25" y="72" width="270" height="250" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="160" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2328">PluginEditor.cpp</text>
  <rect x="40" y="104" width="240" height="40" rx="4" fill="#fbefff" stroke="#8250df"/>
  <text x="52" y="128" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#8250df">#include "PluginProcessor.h"</text>
  <text x="52" y="168" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#1f2328">auto n = processorRef.getName();</text>
  <text x="52" y="196" font-size="10.5" fill="#cf222e">The body of getName() is in a</text>
  <text x="52" y="212" font-size="10.5" fill="#cf222e">DIFFERENT file. This compiler</text>
  <text x="52" y="228" font-size="10.5" fill="#cf222e">run will never see it.</text>

  <rect x="40" y="244" width="240" height="64" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="52" y="264" font-size="10" font-weight="700" fill="#57606a">But the header told it:</text>
  <text x="52" y="282" font-size="9.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#1f2328">const String getName() const;</text>
  <text x="52" y="299" font-size="9.5" fill="#1a7f37">&#8592; a DECLARATION: signature, no body</text>

  <!-- what the compiler needs -->
  <rect x="25" y="336" width="270" height="150" rx="8" fill="#ddf4ff" stroke="#0969da"/>
  <text x="160" y="358" text-anchor="middle" font-size="12" font-weight="700" fill="#0969da">That is genuinely enough</text>
  <text x="42" y="380" font-size="10.5" fill="#1f2328">To emit a CALL instruction the compiler</text>
  <text x="42" y="396" font-size="10.5" fill="#1f2328">only needs to know:</text>
  <text x="42" y="418" font-size="10.5" fill="#1f2328">&#8226; the argument types (what to push)</text>
  <text x="42" y="436" font-size="10.5" fill="#1f2328">&#8226; the return type (how big, where)</text>
  <text x="42" y="454" font-size="10.5" fill="#1f2328">&#8226; the name to jump to</text>
  <text x="42" y="476" font-size="10.5" font-weight="700" fill="#0969da">It does NOT need the body.</text>

  <!-- MIDDLE: object files -->
  <path d="M298 200 L344 200" stroke="#0969da" stroke-width="2" marker-end="url(#b)"/>
  <text x="321" y="192" text-anchor="middle" font-size="9" fill="#0969da">compile</text>

  <rect x="348" y="110" width="260" height="130" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
  <text x="478" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#0969da">PluginEditor.o</text>
  <text x="362" y="154" font-size="10" fill="#57606a">machine code, plus a list of holes:</text>
  <rect x="362" y="162" width="232" height="30" rx="3" fill="#ffebe9" stroke="#cf222e"/>
  <text x="372" y="181" font-size="9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#cf222e">UNDEFINED: _ZNK24Simple&#8230;7getNameEv</text>
  <text x="362" y="212" font-size="10" fill="#1f2328">&#8220;Somebody, somewhere, please</text>
  <text x="362" y="228" font-size="10" fill="#1f2328">provide this. I'll trust you.&#8221;</text>

  <rect x="348" y="300" width="260" height="130" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/>
  <text x="478" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#1a7f37">PluginProcessor.o</text>
  <text x="362" y="344" font-size="10" fill="#57606a">machine code, plus what it offers:</text>
  <rect x="362" y="352" width="232" height="30" rx="3" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="372" y="371" font-size="9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#1a7f37">DEFINED: _ZNK24Simple&#8230;7getNameEv</text>
  <text x="362" y="402" font-size="10" fill="#1f2328">&#8220;I have this one. It starts at</text>
  <text x="362" y="418" font-size="10" fill="#1f2328">byte 1,248 of my code.&#8221;</text>

  <rect x="25" y="500" width="583" height="66" rx="8" fill="#fff8c5" stroke="#bc4c00"/>
  <text x="40" y="522" font-size="11" font-weight="700" fill="#bc4c00">Those mangled names</text>
  <text x="40" y="541" font-size="10.5" fill="#1f2328">C++ encodes the class, function name and argument types into one symbol &#8212; &#8220;name mangling&#8221; &#8212; so that</text>
  <text x="40" y="558" font-size="10.5" fill="#1f2328">overloads like f(int) and f(float) get different symbols. It's also how the linker catches mismatches.</text>

  <!-- RIGHT: linker -->
  <path d="M612 175 C 650 175, 650 250, 688 250" stroke="#8250df" stroke-width="2" fill="none" marker-end="url(#p)"/>
  <path d="M612 365 C 650 365, 650 290, 688 290" stroke="#8250df" stroke-width="2" fill="none" marker-end="url(#p)"/>

  <rect x="690" y="196" width="225" height="150" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="2"/>
  <text x="802" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#8250df">THE LINKER</text>
  <text x="704" y="244" font-size="10.5" fill="#1f2328">Reads every .o's symbol list.</text>
  <text x="704" y="266" font-size="10.5" fill="#1f2328">Matches each UNDEFINED to</text>
  <text x="704" y="282" font-size="10.5" fill="#1f2328">exactly one DEFINED.</text>
  <text x="704" y="306" font-size="10.5" fill="#1f2328">Patches the real address into</text>
  <text x="704" y="322" font-size="10.5" fill="#1f2328">the hole. Writes the binary.</text>

  <rect x="690" y="362" width="225" height="124" rx="8" fill="#ffebe9" stroke="#cf222e"/>
  <text x="802" y="384" text-anchor="middle" font-size="12" font-weight="700" fill="#cf222e">When it can't</text>
  <text x="704" y="406" font-size="10" fill="#1f2328">0 matches &#8594;</text>
  <text x="704" y="422" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#cf222e">undefined symbol</text>
  <text x="704" y="440" font-size="9.5" fill="#57606a">(declared it, forgot to write it)</text>
  <text x="704" y="462" font-size="10" fill="#1f2328">2+ matches &#8594;</text>
  <text x="704" y="478" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#cf222e">duplicate symbol</text>

  <!-- bottom: the C# contrast -->
  <rect x="25" y="582" width="890" height="92" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="40" y="606" font-size="13" font-weight="700" fill="#1f2328">Why C# needs none of this</text>
  <text x="40" y="628" font-size="11" fill="#1f2328">Roslyn reads <tspan font-weight="700">every .cs file in the project at once</tspan>, so it already knows every type and method everywhere.</text>
  <text x="40" y="647" font-size="11" fill="#1f2328">There is nothing to declare separately, so there are no headers &#8212; and the &#8220;link&#8221; step doesn't exist.</text>
  <text x="40" y="666" font-size="11" fill="#57606a">The C++ model is older and file-at-a-time, which is slower to build but lets huge projects compile in parallel.</text>

  <defs>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#0969da"/></marker>
    <marker id="p" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#8250df"/></marker>
  </defs>
</svg>
