<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" width="940" height="620" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="940" height="620" fill="#ffffff"/>
  <text x="470" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2328">A sample is one number. A block is a batch of them.</text>
  <text x="470" y="54" text-anchor="middle" font-size="12" fill="#57606a">Sound is continuous; computers are not. Sampling is how you store a smooth wave as a list of numbers.</text>

  <!-- ===== TOP: the wave and its samples ===== -->
  <text x="40" y="92" font-size="14" font-weight="700" fill="#0969da">1 SAMPLE = the height of the wave, measured at one instant</text>

  <!-- axis -->
  <line x1="60" y1="170" x2="880" y2="170" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="44" y="130" font-size="10" fill="#57606a">+1.0</text>
  <text x="44" y="174" font-size="10" fill="#57606a">0</text>
  <text x="44" y="218" font-size="10" fill="#57606a">−1.0</text>

  <!-- smooth wave -->
  <path d="M60,170 C110,110 150,110 200,170 C250,230 290,230 340,170 C390,110 430,110 480,170 C530,230 570,230 620,170 C670,110 710,110 760,170 C810,230 840,225 880,195"
        fill="none" stroke="#c4b5fd" stroke-width="2.5"/>

  <!-- sample dots + stems -->
  <g fill="#0969da">
    <line x1="60"  y1="170" x2="60"  y2="170" stroke="#0969da" stroke-width="2"/><circle cx="60" cy="170" r="4.5"/>
    <line x1="95"  y1="170" x2="95"  y2="136" stroke="#0969da" stroke-width="2"/><circle cx="95" cy="136" r="4.5"/>
    <line x1="130" y1="170" x2="130" y2="118" stroke="#0969da" stroke-width="2"/><circle cx="130" cy="118" r="4.5"/>
    <line x1="165" y1="170" x2="165" y2="131" stroke="#0969da" stroke-width="2"/><circle cx="165" cy="131" r="4.5"/>
    <line x1="200" y1="170" x2="200" y2="170" stroke="#0969da" stroke-width="2"/><circle cx="200" cy="170" r="4.5"/>
    <line x1="235" y1="170" x2="235" y2="209" stroke="#0969da" stroke-width="2"/><circle cx="235" cy="209" r="4.5"/>
    <line x1="270" y1="170" x2="270" y2="222" stroke="#0969da" stroke-width="2"/><circle cx="270" cy="222" r="4.5"/>
    <line x1="305" y1="170" x2="305" y2="209" stroke="#0969da" stroke-width="2"/><circle cx="305" cy="209" r="4.5"/>
    <line x1="340" y1="170" x2="340" y2="170" stroke="#0969da" stroke-width="2"/><circle cx="340" cy="170" r="4.5"/>
    <line x1="375" y1="170" x2="375" y2="136" stroke="#0969da" stroke-width="2"/><circle cx="375" cy="136" r="4.5"/>
    <line x1="410" y1="170" x2="410" y2="118" stroke="#0969da" stroke-width="2"/><circle cx="410" cy="118" r="4.5"/>
    <line x1="445" y1="170" x2="445" y2="131" stroke="#0969da" stroke-width="2"/><circle cx="445" cy="131" r="4.5"/>
    <line x1="480" y1="170" x2="480" y2="170" stroke="#0969da" stroke-width="2"/><circle cx="480" cy="170" r="4.5"/>
    <line x1="515" y1="170" x2="515" y2="209" stroke="#0969da" stroke-width="2"/><circle cx="515" cy="209" r="4.5"/>
    <line x1="550" y1="170" x2="550" y2="222" stroke="#0969da" stroke-width="2"/><circle cx="550" cy="222" r="4.5"/>
    <line x1="585" y1="170" x2="585" y2="209" stroke="#0969da" stroke-width="2"/><circle cx="585" cy="209" r="4.5"/>
    <line x1="620" y1="170" x2="620" y2="170" stroke="#0969da" stroke-width="2"/><circle cx="620" cy="170" r="4.5"/>
    <line x1="655" y1="170" x2="655" y2="136" stroke="#0969da" stroke-width="2"/><circle cx="655" cy="136" r="4.5"/>
    <line x1="690" y1="170" x2="690" y2="118" stroke="#0969da" stroke-width="2"/><circle cx="690" cy="118" r="4.5"/>
    <line x1="725" y1="170" x2="725" y2="131" stroke="#0969da" stroke-width="2"/><circle cx="725" cy="131" r="4.5"/>
    <line x1="760" y1="170" x2="760" y2="170" stroke="#0969da" stroke-width="2"/><circle cx="760" cy="170" r="4.5"/>
    <line x1="795" y1="170" x2="795" y2="209" stroke="#0969da" stroke-width="2"/><circle cx="795" cy="209" r="4.5"/>
    <line x1="830" y1="170" x2="830" y2="216" stroke="#0969da" stroke-width="2"/><circle cx="830" cy="216" r="4.5"/>
    <line x1="865" y1="170" x2="865" y2="199" stroke="#0969da" stroke-width="2"/><circle cx="865" cy="199" r="4.5"/>
  </g>

  <!-- callout to one sample (right-hand side, clear of the heading) -->
  <line x1="690" y1="118" x2="702" y2="100" stroke="#bc4c00" stroke-width="1.5"/>
  <rect x="700" y="74" width="186" height="26" rx="4" fill="#fff8c5" stroke="#bc4c00"/>
  <text x="709" y="92" font-size="11" fill="#1f2328">one sample = one <tspan font-family="ui-monospace,SFMono-Regular,Menlo,monospace">float</tspan>, e.g. 0.72</text>

  <text x="60" y="250" font-size="11" fill="#57606a">At 48 kHz there are <tspan font-weight="700" fill="#1f2328">48,000 of these dots every second</tspan>, per channel. Close enough together, your ear hears a smooth wave again.</text>

  <!-- ===== MIDDLE: blocks ===== -->
  <text x="40" y="296" font-size="14" font-weight="700" fill="#1a7f37">1 BLOCK = a batch of consecutive samples, handed to you all at once</text>

  <!-- block containers -->
  <g>
    <rect x="60" y="316" width="270" height="62" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
    <text x="195" y="338" text-anchor="middle" font-size="11" font-weight="700" fill="#1a7f37">block 1</text>
    <text x="195" y="356" text-anchor="middle" font-size="10" fill="#57606a">512 samples</text>
    <text x="195" y="371" text-anchor="middle" font-size="10" fill="#57606a">= 10.7 ms of audio</text>

    <rect x="340" y="316" width="270" height="62" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
    <text x="475" y="338" text-anchor="middle" font-size="11" font-weight="700" fill="#1a7f37">block 2</text>
    <text x="475" y="356" text-anchor="middle" font-size="10" fill="#57606a">512 samples</text>
    <text x="475" y="371" text-anchor="middle" font-size="10" fill="#57606a">= 10.7 ms of audio</text>

    <rect x="620" y="316" width="260" height="62" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
    <text x="750" y="338" text-anchor="middle" font-size="11" font-weight="700" fill="#1a7f37">block 3</text>
    <text x="750" y="356" text-anchor="middle" font-size="10" fill="#57606a">512 samples</text>
    <text x="750" y="371" text-anchor="middle" font-size="10" fill="#57606a">= 10.7 ms of audio</text>
  </g>

  <!-- processBlock calls -->
  <g>
    <path d="M195 392 L195 412" stroke="#8250df" stroke-width="2" marker-end="url(#pv)"/>
    <path d="M475 392 L475 412" stroke="#8250df" stroke-width="2" marker-end="url(#pv)"/>
    <path d="M750 392 L750 412" stroke="#8250df" stroke-width="2" marker-end="url(#pv)"/>
    <rect x="95" y="414" width="200" height="28" rx="5" fill="#fbefff" stroke="#8250df"/>
    <text x="195" y="433" text-anchor="middle" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#8250df">processBlock()</text>
    <rect x="375" y="414" width="200" height="28" rx="5" fill="#fbefff" stroke="#8250df"/>
    <text x="475" y="433" text-anchor="middle" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#8250df">processBlock()</text>
    <rect x="650" y="414" width="200" height="28" rx="5" fill="#fbefff" stroke="#8250df"/>
    <text x="750" y="433" text-anchor="middle" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#8250df">processBlock()</text>
  </g>
  <text x="60" y="466" font-size="11" fill="#57606a">The DAW calls your plugin <tspan font-weight="700" fill="#1f2328">once per block</tspan> — about 94 times a second at 512 samples — not once per sample.</text>

  <!-- ===== BOTTOM: why blocks ===== -->
  <rect x="40" y="486" width="430" height="114" rx="9" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="58" y="510" font-size="13" font-weight="700" fill="#1f2328">Why batch at all?</text>
  <text x="58" y="532" font-size="11" fill="#1f2328">Calling a function 48,000 times a second is mostly overhead —</text>
  <text x="58" y="549" font-size="11" fill="#1f2328">the call itself would cost more than the work inside it.</text>
  <text x="58" y="571" font-size="11" fill="#1f2328">Batching pays that cost once per 512 samples instead, and lets</text>
  <text x="58" y="588" font-size="11" fill="#1f2328">the CPU process several samples at once with SIMD.</text>

  <rect x="486" y="486" width="414" height="114" rx="9" fill="#ffebe9" stroke="#cf222e"/>
  <text x="504" y="510" font-size="13" font-weight="700" fill="#cf222e">The trade-off: latency</text>
  <text x="504" y="532" font-size="11" fill="#1f2328">Bigger block = more time to finish = safer, but you wait longer</text>
  <text x="504" y="549" font-size="11" fill="#1f2328">before hearing anything. 512 samples ≈ 10.7 ms of delay.</text>
  <text x="504" y="571" font-size="11" fill="#1f2328">Smaller block = snappier, but less time per call to keep up.</text>
  <text x="504" y="588" font-size="11" fill="#1f2328">64 samples gives you just 1.3 ms to do all your work.</text>

  <defs>
    <marker id="pv" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#8250df"/></marker>
  </defs>
</svg>
