<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2328">&#8220;Must never block&#8221; means: must always finish in time</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#57606a">At 48 kHz with a 512-sample block, the sound card needs new audio every 10.7 ms. Forever.</text>

  <!-- GOOD -->
  <text x="40" y="92" font-size="14" font-weight="700" fill="#1a7f37">HEALTHY — work finishes well inside the deadline</text>
  <line x1="40" y1="180" x2="860" y2="180" stroke="#d0d7de" stroke-width="2"/>
  <g font-size="10" fill="#57606a">
    <line x1="40"  y1="174" x2="40"  y2="186" stroke="#57606a"/>
    <line x1="245" y1="174" x2="245" y2="186" stroke="#57606a"/>
    <line x1="450" y1="174" x2="450" y2="186" stroke="#57606a"/>
    <line x1="655" y1="174" x2="655" y2="186" stroke="#57606a"/>
    <line x1="860" y1="174" x2="860" y2="186" stroke="#57606a"/>
    <text x="40"  y="200" text-anchor="middle">0 ms</text>
    <text x="245" y="200" text-anchor="middle">10.7</text>
    <text x="450" y="200" text-anchor="middle">21.3</text>
    <text x="655" y="200" text-anchor="middle">32.0</text>
    <text x="860" y="200" text-anchor="middle">42.7</text>
  </g>
  <rect x="42"  y="140" width="70" height="34" rx="4" fill="#dafbe1" stroke="#1a7f37"/>
  <rect x="247" y="140" width="70" height="34" rx="4" fill="#dafbe1" stroke="#1a7f37"/>
  <rect x="452" y="140" width="70" height="34" rx="4" fill="#dafbe1" stroke="#1a7f37"/>
  <rect x="657" y="140" width="70" height="34" rx="4" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="77"  y="162" text-anchor="middle" font-size="10" fill="#1a7f37">work</text>
  <text x="282" y="162" text-anchor="middle" font-size="10" fill="#1a7f37">work</text>
  <text x="487" y="162" text-anchor="middle" font-size="10" fill="#1a7f37">work</text>
  <text x="692" y="162" text-anchor="middle" font-size="10" fill="#1a7f37">work</text>
  <text x="180" y="162" font-size="10" fill="#57606a">idle</text>
  <text x="385" y="162" font-size="10" fill="#57606a">idle</text>
  <text x="590" y="162" font-size="10" fill="#57606a">idle</text>
  <text x="795" y="162" font-size="10" fill="#57606a">idle</text>
  <text x="40" y="228" font-size="12" fill="#1a7f37">Result: continuous, clean audio.</text>

  <!-- BAD -->
  <text x="40" y="290" font-size="14" font-weight="700" fill="#cf222e">BLOCKED — one call waits on something (a lock, malloc, a file, a log)</text>
  <line x1="40" y1="378" x2="860" y2="378" stroke="#d0d7de" stroke-width="2"/>
  <g font-size="10" fill="#57606a">
    <line x1="40"  y1="372" x2="40"  y2="384" stroke="#57606a"/>
    <line x1="245" y1="372" x2="245" y2="384" stroke="#57606a"/>
    <line x1="450" y1="372" x2="450" y2="384" stroke="#57606a"/>
    <line x1="655" y1="372" x2="655" y2="384" stroke="#57606a"/>
    <line x1="860" y1="372" x2="860" y2="384" stroke="#57606a"/>
    <text x="40"  y="398" text-anchor="middle">0 ms</text>
    <text x="245" y="398" text-anchor="middle">10.7</text>
    <text x="450" y="398" text-anchor="middle">21.3</text>
    <text x="655" y="398" text-anchor="middle">32.0</text>
    <text x="860" y="398" text-anchor="middle">42.7</text>
  </g>
  <rect x="42"  y="338" width="70" height="34" rx="4" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="77"  y="360" text-anchor="middle" font-size="10" fill="#1a7f37">work</text>

  <rect x="247" y="338" width="60" height="34" rx="4" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="277" y="360" text-anchor="middle" font-size="10" fill="#1a7f37">work</text>
  <rect x="307" y="338" width="215" height="34" rx="4" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/>
  <text x="414" y="360" text-anchor="middle" font-size="11" font-weight="600" fill="#cf222e">BLOCKED — waiting&#8230;</text>

  <line x1="450" y1="318" x2="450" y2="378" stroke="#cf222e" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="458" y="330" font-size="11" font-weight="700" fill="#cf222e">deadline missed</text>

  <rect x="522" y="338" width="90" height="34" rx="4" fill="#fff8c5" stroke="#bc4c00"/>
  <text x="567" y="360" text-anchor="middle" font-size="10" fill="#bc4c00">too late</text>
  <rect x="657" y="338" width="70" height="34" rx="4" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="692" y="360" text-anchor="middle" font-size="10" fill="#1a7f37">work</text>

  <text x="40" y="426" font-size="12" fill="#cf222e">Result: the sound card had nothing to play. The user hears a CLICK. Permanently, in their recording.</text>

  <rect x="40" y="444" width="820" height="58" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="56" y="466" font-size="12" font-weight="700" fill="#1f2328">The thread is not &#8220;interrupted&#8221; — it is the opposite.</text>
  <text x="56" y="486" font-size="12" fill="#1f2328">&#8220;Blocking&#8221; = your code voluntarily goes to sleep waiting for something. Nobody stopped you; you stopped yourself.</text>
</svg>
