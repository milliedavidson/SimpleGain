<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2328">An app owns the loop. A library gets called.</text>

  <!-- LEFT: APP -->
  <rect x="30" y="55" width="390" height="380" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="225" y="83" text-anchor="middle" font-size="15" font-weight="700" fill="#0969da">APPLICATION  (e.g. your C# console app)</text>

  <rect x="60" y="100" width="330" height="46" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="225" y="129" text-anchor="middle" font-size="13" fill="#57606a">Operating system</text>

  <path d="M225 146 L225 176" stroke="#57606a" stroke-width="2" marker-end="url(#a1)"/>
  <text x="240" y="167" font-size="11" fill="#57606a">launches</text>

  <rect x="60" y="176" width="330" height="240" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="225" y="202" text-anchor="middle" font-size="14" font-weight="700" fill="#0969da">YOUR CODE</text>
  <rect x="85" y="216" width="280" height="38" rx="5" fill="#ffffff" stroke="#0969da"/>
  <text x="225" y="240" text-anchor="middle" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#1f2328">static void Main()</text>

  <text x="225" y="282" text-anchor="middle" font-size="12" fill="#1f2328">You decide what happens next.</text>
  <text x="225" y="302" text-anchor="middle" font-size="12" fill="#1f2328">You open files, start threads,</text>
  <text x="225" y="322" text-anchor="middle" font-size="12" fill="#1f2328">run your own loop, and exit</text>
  <text x="225" y="342" text-anchor="middle" font-size="12" fill="#1f2328">when you feel like it.</text>

  <rect x="85" y="360" width="280" height="38" rx="5" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="225" y="384" text-anchor="middle" font-size="12" font-weight="600" fill="#1a7f37">You are in control</text>

  <!-- RIGHT: LIBRARY / PLUGIN -->
  <rect x="480" y="55" width="390" height="380" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="675" y="83" text-anchor="middle" font-size="15" font-weight="700" fill="#8250df">LIBRARY / PLUGIN  (SimpleGain)</text>

  <rect x="510" y="100" width="330" height="46" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="675" y="129" text-anchor="middle" font-size="13" fill="#57606a">Operating system</text>

  <path d="M675 146 L675 170" stroke="#57606a" stroke-width="2" marker-end="url(#a1)"/>

  <rect x="510" y="170" width="330" height="246" rx="6" fill="#fbefff" stroke="#8250df" stroke-width="2"/>
  <text x="675" y="194" text-anchor="middle" font-size="14" font-weight="700" fill="#8250df">THE DAW  (Logic / Ableton)</text>
  <text x="675" y="213" text-anchor="middle" font-size="11" fill="#57606a">owns main(), the clock, the sound card</text>

  <rect x="540" y="228" width="270" height="170" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="675" y="251" text-anchor="middle" font-size="13" font-weight="700" fill="#0969da">YOUR CODE</text>
  <text x="675" y="270" text-anchor="middle" font-size="11" fill="#57606a">no main(), no loop of your own</text>

  <rect x="558" y="282" width="234" height="32" rx="5" fill="#ffffff" stroke="#0969da"/>
  <text x="675" y="303" text-anchor="middle" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#1f2328">prepareToPlay()</text>

  <rect x="558" y="320" width="234" height="32" rx="5" fill="#ffffff" stroke="#cf222e" stroke-width="2"/>
  <text x="675" y="341" text-anchor="middle" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#cf222e">processBlock()</text>

  <rect x="558" y="358" width="234" height="32" rx="5" fill="#ffffff" stroke="#0969da"/>
  <text x="675" y="379" text-anchor="middle" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#1f2328">createEditor()</text>

  <path d="M528 298 L556 298" stroke="#8250df" stroke-width="2" marker-end="url(#a2)"/>
  <path d="M528 336 L556 336" stroke="#8250df" stroke-width="2" marker-end="url(#a2)"/>
  <path d="M528 374 L556 374" stroke="#8250df" stroke-width="2" marker-end="url(#a2)"/>
  <text x="497" y="340" font-size="11" fill="#8250df" transform="rotate(-90 497 340)" text-anchor="middle">DAW calls you</text>

  <rect x="510" y="402" width="330" height="0" fill="none"/>

  <text x="450" y="458" text-anchor="middle" font-size="12" fill="#57606a">This is &#8220;inversion of control&#8221; — same idea as implementing an interface a framework calls.</text>

  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#57606a"/></marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#8250df"/></marker>
  </defs>
</svg>
